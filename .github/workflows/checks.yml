name: Tests and release hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check src tests examples tools
      - run: ruff format --check src tests examples tools
      - run: python tools/check_release.py
      - run: wavelet-runs demo --output outputs/demo_features.npz
      - run: python examples/synthetic_workflow.py
